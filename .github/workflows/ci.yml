name: Lab1 CI/CD

on:
  push:
    branches: ["main", "feat/*"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr cppcheck doxygen

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            -I lab1/include lab1/src

      - name: Configure CMake with coverage
        run: |
          cmake -S lab1 -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Build project and tests
        run: |
          cmake --build build --parallel

      - name: Run unit tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Check test coverage (> 90%)
        run: |
          gcovr --root lab1 --filter "lab1/src/" --exclude "lab1/src/CliMenu.cpp" \
            --exclude "lab1/src/main.cpp" --fail-under-line 90 --print-summary

      - name: Generate Doxygen documentation
        run: |
          cd lab1 && doxygen Doxyfile

      - name: Package release binary
        run: |
          mkdir -p dist
          cp build/lab1_cli dist/
          cp lab1/sample_matrix.txt dist/
          tar -czvf lab1_cli_linux.tar.gz -C dist .

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lab1_cli_linux.tar.gz
